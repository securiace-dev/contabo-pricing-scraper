name: Scraper Parity

on:
  pull_request:
    paths:
      - 'src/**'
      # The Axum web server (src/api/**) is Rust-only — it has no Node
      # counterpart and is not part of scraper output parity. Exclude it so
      # API-only changes don't trigger (and 403-fail) this check.
      - '!src/api/**'
      - 'scripts/contabo_scraper.js'
      - '.github/scripts/enrich_output.js'
      - '.github/scripts/parity_check.sh'
      - '.github/workflows/parity.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

# A breaking parity diff blocks the merge — the two scrapers must stay equivalent
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: Rust ↔ Node output equivalence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: contabo-ci-pr
    timeout-minutes: 20
    # The SCRAPER_PROXY secret lives in the "Build" environment. Declaring it
    # here grants the job access so both scrapers can fetch through the proxy
    # (bypassing the Cloudflare datacenter-IP 403 block) for a real parity diff.
    environment: Build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0

      - name: Cache Cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: contabo-ci-pr-${{ runner.arch }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: contabo-ci-pr-${{ runner.arch }}-rust-1.96.0-cargo-

      - name: Set up Node 20.19.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.5'
          cache: npm

      # undici provides the ProxyAgent the Node scraper uses for SCRAPER_PROXY.
      # --ignore-scripts skips cloakbrowser/playwright postinstall browser
      # downloads, which the parity Node path does not need.
      - name: Install Node deps
        run: npm ci --ignore-scripts

      - name: Run parity check
        env:
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: bash .github/scripts/parity_check.sh

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-diff
          path: /tmp/contabo-parity.*
          if-no-files-found: ignore
