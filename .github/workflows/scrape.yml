name: Scrape Contabo Pricing

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC daily
    - cron: '0 18 * * *'   # 18:00 UTC daily
  workflow_dispatch:
    inputs:
      plans:
        description: 'Comma-separated plan slugs (blank = all active)'
        required: false
        default: ''
      concurrency:
        description: 'Parallel fetches 1-16 (overrides SCRAPER_CONCURRENCY)'
        required: false
        default: ''

# Prevent overlapping scheduled + manual runs on the same ref; cancel in-progress
# if a newer run starts. Per-ref so a dispatch on a feature branch never collides
# with the scheduled run on main — only one scrape push job runs per branch/ref.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: true

# Defaults — override without editing YAML via:
#   GitHub Settings → Secrets and variables → Variables (repo-level)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCRAPER_CONCURRENCY: ${{ vars.SCRAPER_CONCURRENCY || '8' }}
  SCRAPER_RETRIES:     ${{ vars.SCRAPER_RETRIES     || '3' }}
  BINARY_VERSION:      ${{ vars.BINARY_VERSION       || 'latest' }}
  # FETCH_MODE controls the HTTP backend:
  #   reqwest — fast, header-level evasion only (default)
  #   auto    — reqwest first; CloakBrowser fallback for blocked URLs
  #   cloak   — CloakBrowser only (patched Chromium, strongest evasion)
  FETCH_MODE:          ${{ vars.FETCH_MODE || 'reqwest' }}
  OUTPUT_DIR:          'data/output'

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    name: Scrape & publish
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the pre-push rebase can find a merge base against the
          # latest origin/<branch> (a shallow clone makes rebase unreliable).
          fetch-depth: 0

      # Resolve "latest" → concrete tag so cache key is stable across runs
      - name: Resolve binary version
        id: ver
        run: |
          if [ "$BINARY_VERSION" = "latest" ]; then
            TAG=$(gh release view --json tagName -q '.tagName')
          else
            TAG="$BINARY_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cache keyed by release tag — re-download only when a new release ships
      - name: Cache scraper binary
        id: cache
        uses: actions/cache@v4
        with:
          path: bin/contabo-scraper
          key: binary-${{ steps.ver.outputs.tag }}-linux-x86_64

      - name: Download binary
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          gh release download "${{ steps.ver.outputs.tag }}" \
            --pattern 'contabo-scraper-linux-x86_64' \
            --output bin/contabo-scraper
          chmod +x bin/contabo-scraper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install CloakBrowser npm wrapper + resolve the Chromium binary version.
      # Skipped in reqwest-only mode to avoid a 200MB download on every run.
      # The binary itself auto-downloads on first launch (~200MB, cached below).
      - name: Resolve CloakBrowser version
        id: cloak-ver
        if: env.FETCH_MODE != 'reqwest'
        run: |
          npm install --prefix /tmp/cloak-deps cloakbrowser playwright-core --omit=dev --prefer-offline 2>/dev/null || \
            npm install --prefix /tmp/cloak-deps cloakbrowser playwright-core --omit=dev
          VER=$(node -e "console.log(require('/tmp/cloak-deps/node_modules/cloakbrowser/package.json').version)" 2>/dev/null || echo "unknown")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cache CloakBrowser Chromium binary
        id: cloak-cache
        if: env.FETCH_MODE != 'reqwest'
        uses: actions/cache@v4
        with:
          # CloakBrowser stores its patched Chromium binary in ~/.cloakbrowser/
          # (not ~/.cache/ms-playwright). The binary auto-downloads on first launch()
          # and is cached here to avoid a 200MB download on every subsequent run.
          path: ~/.cloakbrowser
          key: cloakbrowser-chromium-${{ steps.cloak-ver.outputs.version }}-linux-x86_64

      - name: Pre-download CloakBrowser Chromium binary
        if: env.FETCH_MODE != 'reqwest' && steps.cloak-cache.outputs.cache-hit != 'true'
        run: |
          # Trigger the auto-download by launching and immediately closing a browser.
          # CloakBrowser has no separate install() function in its JS SDK; the binary
          # downloads on first launch() call and is cached in ~/.cloakbrowser/.
          node --input-type=module <<'EOF'
          import { launch } from '/tmp/cloak-deps/node_modules/cloakbrowser/index.mjs';
          const b = await launch({ headless: true });
          await b.close();
          EOF
        continue-on-error: true

      - name: Discover plan URLs
        id: discover
        run: node .github/scripts/discover_plans.js

      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: |
          CONCURRENCY="${{ github.event.inputs.concurrency || env.SCRAPER_CONCURRENCY }}"
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.plans }}" ]; then
            EXTRA_ARGS="--plans ${{ github.event.inputs.plans }}"
          fi
          mkdir -p "$OUTPUT_DIR"

          # Build CloakBrowser args only when mode requires it
          CLOAK_ARGS=""
          if [ "$FETCH_MODE" != "reqwest" ]; then
            CLOAK_ARGS="--fetch-mode $FETCH_MODE --cloak-script /tmp/cloak-deps/node_modules/.bin/cloak-fetch.mjs"
          fi

          bin/contabo-scraper \
            --output          "$OUTPUT_DIR" \
            --concurrency     "$CONCURRENCY" \
            --retries         "$SCRAPER_RETRIES" \
            --json            \
            --plan-urls-file  data/plan_urls.json \
            $CLOAK_ARGS       \
            $EXTRA_ARGS

      - name: Enrich output
        run: node .github/scripts/enrich_output.js

      - name: Generate PRICES.md
        run: node .github/scripts/generate_report.js

      - name: Generate report.html
        run: node .github/scripts/generate_html.js

      - name: Audit and alert
        run: |
          node .github/scripts/post_scrape_audit.js \
            --gap-report          "$OUTPUT_DIR/contabo_gap_report.json" \
            --discovery-changed   "${{ steps.discover.outputs.changed }}" \
            --discovery-blocked   "${{ steps.discover.outputs.discovery_blocked }}" \
            --added               "${{ steps.discover.outputs.added }}" \
            --removed             "${{ steps.discover.outputs.removed }}" \
            --renamed             "${{ steps.discover.outputs.renamed }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY scrape/generated artifacts — never `git add -A`/`.`, so
          # WHMCS addon source (whmcs-module/**), Rust src, etc. can never be
          # swept into a data commit.
          git add -f "$OUTPUT_DIR"   # -f bypasses data/output/ in .gitignore
          git add PRICES.md
          git add report.html
          git add data/plan_urls.json

          # Exit cleanly when the scrape produced no changes.
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi

          # Defence in depth: refuse to commit if anything outside the
          # scrape/generated allowlist somehow got staged. This is the hard stop
          # that keeps automated data commits from racing in addon source.
          ALLOWED='^(data/output/|data/plan_urls\.json$|PRICES\.md$|report\.html$)'
          UNEXPECTED="$(git diff --cached --name-only | grep -vE "$ALLOWED" || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Refusing to commit — paths outside the scrape/generated allowlist are staged:"
            echo "$UNEXPECTED"
            exit 1
          fi

          MSG="data: scrape $(date -u '+%Y-%m-%d %H:%M UTC')"
          if [ "${{ steps.discover.outputs.changed }}" = "true" ]; then
            MSG="$MSG [catalog: +${{ steps.discover.outputs.added }} -${{ steps.discover.outputs.removed }}]"
          fi
          git commit -m "$MSG"

          # Push, rebasing onto the latest origin/<branch> first so a manual
          # commit that landed during the scrape is preserved, never clobbered.
          # Retry the fetch→rebase→push cycle to survive a push that lands in the
          # narrow window between our fetch and push. NEVER force-push: on a
          # rebase conflict we abort and fail the job, leaving main untouched.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "::error::Rebase onto origin/$BRANCH conflicted — aborting without force-push"
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed to $BRANCH on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt (concurrent commit on $BRANCH) — retrying"
          done
          echo "::error::Could not push after 3 rebase attempts — persistent contention on $BRANCH"
          exit 1
