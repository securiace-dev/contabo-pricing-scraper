name: Release contabo_pricing addon

# Tests and packages the addon with read-only permissions, then grants
# contents:write only to the minimal publish job. A release is created only
# after AdminController::VERSION is bumped to a tag that does not yet exist.

on:
  push:
    branches: [main]
    paths:
      # Positive runtime tree first; ordered negatives mirror
      # scripts/package-whmcs-suite.sh copy_runtime_tree().
      - 'whmcs-module/modules/addons/contabo_pricing/**'
      - '!whmcs-module/modules/addons/contabo_pricing/vendor/**'
      - '!whmcs-module/modules/addons/contabo_pricing/tests/**'
      - '!whmcs-module/modules/addons/contabo_pricing/docs/**'
      - '!whmcs-module/modules/addons/contabo_pricing/CHANGELOG.md'
      - '!whmcs-module/modules/addons/contabo_pricing/.phpunit.cache/**'
      - '!whmcs-module/modules/addons/contabo_pricing/.phpunit.result.cache'
      - '!whmcs-module/modules/addons/contabo_pricing/phpunit.xml'
      - '!whmcs-module/modules/addons/contabo_pricing/composer.lock'
      - '!whmcs-module/modules/addons/contabo_pricing/.git*'
      - '!whmcs-module/modules/addons/contabo_pricing/.claude-flow/**'
      - '!whmcs-module/modules/addons/contabo_pricing/graphify-out/**'
      - 'scripts/package-whmcs-suite.sh'
      - 'scripts/extract-changelog-section.sh'
      - 'scripts/inspect-github-release.sh'
      - '.github/workflows/release-contabo-pricing.yml'
  workflow_dispatch:

concurrency:
  group: release-contabo-pricing
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package contabo_pricing
    if: github.ref == 'refs/heads/main'
    runs-on: contabo-ci-release
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      exists: ${{ steps.meta.outputs.exists }}
    env:
      MODULE_DIR: whmcs-module/modules/addons/contabo_pricing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify host PHP 8.2 and Composer
        run: |
          test "$(/usr/bin/php8.2 -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "8.2"
          /usr/bin/php8.2 /usr/local/bin/composer --version

      - name: Resolve version and release state
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_NEW_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*const VERSION = '\\([^']*\\)'.*/\\1/p" "$MODULE_DIR/lib/AdminController.php" | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::invalid AdminController::VERSION: $VERSION"
            exit 1
          fi
          TAG="contabo_pricing-v${VERSION}"
          STATE="$(
            scripts/inspect-github-release.sh \
              "$TAG" \
              "contabo_pricing-v${VERSION}.zip" \
              "contabo_pricing-v${VERSION}.zip.sha256" \
              "contabo_pricing-v${VERSION}.zip.manifest"
          )"
          if [ "$STATE" = "complete" ]; then
            EXISTS=true
          else
            EXISTS=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "contabo_pricing $VERSION -> $TAG (already released: $EXISTS)"

      - name: Install dev dependencies
        working-directory: ${{ env.MODULE_DIR }}
        run: /usr/bin/php8.2 /usr/local/bin/composer install --no-interaction --no-progress

      - name: Lint executable runtime and templates
        run: |
          set -euo pipefail
          find "$MODULE_DIR" -type f \( -name '*.php' -o -name '*.tpl' \) \
            -not -path '*/vendor/*' \
            -not -path '*/tests/*' \
            -print0 |
            xargs -0 -n1 /usr/bin/php8.2 -l >/dev/null

      - name: Unit tests
        working-directory: ${{ env.MODULE_DIR }}
        run: /usr/bin/php8.2 vendor/bin/phpunit

      - name: Build and inspect installable package
        if: steps.meta.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/package-whmcs-suite.sh --addon
          ZIP="dist/contabo_pricing-v${VERSION}.zip"
          test -s "$ZIP"
          test -s "$ZIP.sha256"
          test -s "$ZIP.manifest"
          unzip -t "$ZIP"

      - name: Build exact release notes
        if: steps.meta.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="dist/contabo-pricing-notes.md"
          scripts/extract-changelog-section.sh \
            "$MODULE_DIR/CHANGELOG.md" "" "$VERSION" > "$NOTES"
          cat >> "$NOTES" <<'EOF'

          ### Install
          1. Download and unzip the attached ZIP at your WHMCS root; it lays down `modules/addons/contabo_pricing/`.
          2. Activate under **Setup → Addon Modules**; the schema migrates on first admin page load.

          Verify the ZIP against `.sha256` and inspect `.manifest` before installation.
          EOF

      - name: Stage verified release payload
        if: steps.meta.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contabo-pricing-release
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/contabo_pricing-v${{ steps.meta.outputs.version }}.zip
            dist/contabo_pricing-v${{ steps.meta.outputs.version }}.zip.sha256
            dist/contabo_pricing-v${{ steps.meta.outputs.version }}.zip.manifest
            dist/contabo-pricing-notes.md

      - name: Existing release notice
        if: steps.meta.outputs.exists == 'true'
        run: echo "::notice::${{ steps.meta.outputs.tag }} already exists. Bump AdminController::VERSION for a new release."

  publish:
    name: Publish contabo_pricing
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: contabo-ci-release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contabo-pricing-release
          path: release

      - name: Publish immutable version payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -s "release/contabo_pricing-v${VERSION}.zip"
          test -s "release/contabo_pricing-v${VERSION}.zip.sha256"
          test -s "release/contabo_pricing-v${VERSION}.zip.manifest"
          test -s "release/contabo-pricing-notes.md"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "contabo_pricing ${VERSION}" \
            --notes-file "release/contabo-pricing-notes.md" \
            "release/contabo_pricing-v${VERSION}.zip" \
            "release/contabo_pricing-v${VERSION}.zip.sha256" \
            "release/contabo_pricing-v${VERSION}.zip.manifest"
