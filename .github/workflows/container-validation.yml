name: Trusted Linux Container Validation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'report.html'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/container-validation.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-container-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-container:
    name: Linux OCI and browser runtime
    runs-on: contabo-ci-release
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify trusted release runner capabilities
        run: |
          set -euo pipefail
          for command in curl docker; do
            command -v "$command"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build multi-architecture OCI image without publishing
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output "type=oci,dest=${RUNNER_TEMP}/contabo-multiarch.tar" \
            .
          test -s "${RUNNER_TEMP}/contabo-multiarch.tar"

      - name: Build and smoke native image without publishing
        run: |
          set -euo pipefail
          IMAGE="contabo-release-validation:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NAME="contabo-release-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BROWSER_VOLUME="contabo-release-validation-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true; docker volume rm -f "$BROWSER_VOLUME" >/dev/null 2>&1 || true; docker image rm -f "$IMAGE" >/dev/null 2>&1 || true' EXIT

          docker build --tag "$IMAGE" .
          docker run --rm "$IMAGE" --version
          docker volume create "$BROWSER_VOLUME"
          docker run --rm \
            --mount "source=${BROWSER_VOLUME},target=/home/contabo/.cloakbrowser" \
            --entrypoint /usr/local/bin/node \
            "$IMAGE" \
            --input-type=module \
            --eval "const { launch } = await import('/app/node_modules/cloakbrowser/dist/index.js'); const browser = await launch({ headless: true }); await browser.close()"
          docker run --rm -d --name "$NAME" -p 127.0.0.1::8080 "$IMAGE"
          PORT="$(docker port "$NAME" 8080/tcp | sed -n 's/.*://p' | head -n 1)"
          test -n "$PORT"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health"; then
              exit 0
            fi
            sleep 2
          done
          echo "Dry-run image health endpoint did not become ready" >&2
          exit 1
