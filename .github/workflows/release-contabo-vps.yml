name: Release contabo_vps module

# Cuts a versioned GitHub Release + installable ZIP of the WHMCS server /
# provisioning module (modules/servers/contabo_vps) when a change to its SHIPPED
# files lands on main and its version (CONTABO_VPS_VERSION in contabo_vps.php)
# has been bumped.
#
# Trigger scope = exactly the files that go into the release ZIP (mirrors the
# package's exclude list via `!` negations): tests/ and dev config are NOT
# shipped, so editing them never triggers a run — the two module workflows stay
# independent. The version constant lives in a shipped file (contabo_vps.php),
# so bumping it triggers a real release; a shipped-code change WITHOUT a version
# bump runs but skips publishing (already released — idempotent).
#
# Tag scheme: contabo_vps-v<version> (never matches the Rust scraper's `v*`
# tags, so release.yml is not triggered).

on:
  push:
    branches: [main]
    paths:
      - 'whmcs-module/modules/servers/contabo_vps/**'
      - '!whmcs-module/modules/servers/contabo_vps/tests/**'
      - '!whmcs-module/modules/servers/contabo_vps/phpunit.xml'
      - '.github/workflows/release-contabo-vps.yml'
  workflow_dispatch:

concurrency:
  group: release-contabo-vps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package & release contabo_vps
    runs-on: ubuntu-latest
    env:
      MODULE_DIR: whmcs-module/modules/servers/contabo_vps
      ADDON_DIR: whmcs-module/modules/addons/contabo_pricing
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, curl, mbstring
          tools: composer

      # Quality gate. The server-module suite runs on the addon's PHPUnit and
      # its FakeCapsule (both modules ship together), so install the addon's
      # dev deps first, then run the server suite against them.
      - name: Install PHPUnit (via addon dev deps)
        working-directory: ${{ env.ADDON_DIR }}
        run: composer install --no-interaction --no-progress

      - name: Lint (php -l)
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          set -e
          find lib -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l contabo_vps.php >/dev/null
          php -l hooks.php >/dev/null

      - name: Unit tests
        working-directory: ${{ env.MODULE_DIR }}
        run: ../../addons/contabo_pricing/vendor/bin/phpunit -c phpunit.xml

      - name: Resolve version & release state
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -oP "define\('CONTABO_VPS_VERSION',\s*'\K[^']+" "$MODULE_DIR/contabo_vps.php")
          if [ -z "$VERSION" ]; then echo "::error::could not read CONTABO_VPS_VERSION"; exit 1; fi
          TAG="contabo_vps-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "contabo_vps $VERSION → tag $TAG (already released: $EXISTS)"

      - name: Skip note
        if: steps.meta.outputs.exists == 'true'
        run: echo "::notice::Release ${{ steps.meta.outputs.tag }} already exists — nothing to do. Bump CONTABO_VPS_VERSION to cut a new one."

      - name: Build installable package
        if: steps.meta.outputs.exists == 'false'
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/modules/servers/contabo_vps"
          # Runtime only — no Composer, no autoloader (require_once). Exclude the
          # test harness and dev config. tar --exclude prunes during archiving.
          tar -C "$MODULE_DIR" \
            --exclude='./tests' \
            --exclude='./.phpunit.cache' \
            --exclude='./phpunit.xml' \
            --exclude='./.git*' \
            -cf - . | tar -C "$STAGE/modules/servers/contabo_vps" -xf -
          ZIP="contabo_vps-v${VERSION}.zip"
          ( cd "$STAGE" && zip -rq "$OLDPWD/$ZIP" modules )
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        if: steps.meta.outputs.exists == 'false'
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          # The server module's changelog entries live in the addon CHANGELOG,
          # headed "## contabo_vps <version> — …".
          BODY="$(awk -v ver="contabo_vps ${VERSION}" '
            $0 ~ "^## " && index($0, ver) {flag=1; print; next}
            flag && /^## / {exit}
            flag {print}
          ' "$ADDON_DIR/CHANGELOG.md")"
          {
            echo "body<<EOF"
            if [ -n "$BODY" ]; then echo "$BODY"; else echo "See CHANGELOG.md for details."; fi
            echo ""
            echo "### Install"
            echo "1. Download and unzip \`contabo_vps-v${VERSION}.zip\` at your WHMCS root (it lays down \`modules/servers/contabo_vps/\`)."
            echo "2. Add a server under **System Settings → Servers** using the **Contabo VPS** module, then assign it to a product. Run **Test Connection** before ordering."
            echo ""
            echo "Verify the download against \`.sha256\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: contabo_vps ${{ steps.meta.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
          draft: false
          prerelease: false
