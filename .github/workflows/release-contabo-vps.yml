name: Release SecuriAce VPS suite

# Publishes the canonical WHMCS provisioning runtime as one installable archive:
# securiacevps + contabo_vps compatibility shim + VPS Standard Cart child theme.
# Verification and packaging are read-only; only the minimal publish job gets
# contents:write. This workflow never deploys WHMCS or calls Contabo.

on:
  push:
    branches: [main]
    paths:
      - 'whmcs-module/modules/servers/securiacevps/**'
      - '!whmcs-module/modules/servers/securiacevps/tests/**'
      - '!whmcs-module/modules/servers/securiacevps/docs/**'
      - '!whmcs-module/modules/servers/securiacevps/.phpunit.cache/**'
      - '!whmcs-module/modules/servers/securiacevps/.phpunit.result.cache'
      - '!whmcs-module/modules/servers/securiacevps/phpunit.xml'
      - '!whmcs-module/modules/servers/securiacevps/composer.lock'
      - '!whmcs-module/modules/servers/securiacevps/.git*'
      - '!whmcs-module/modules/servers/securiacevps/.claude-flow/**'
      - '!whmcs-module/modules/servers/securiacevps/graphify-out/**'
      - 'whmcs-module/modules/servers/contabo_vps/**'
      - '!whmcs-module/modules/servers/contabo_vps/tests/**'
      - '!whmcs-module/modules/servers/contabo_vps/docs/**'
      - '!whmcs-module/modules/servers/contabo_vps/.phpunit.cache/**'
      - '!whmcs-module/modules/servers/contabo_vps/.phpunit.result.cache'
      - '!whmcs-module/modules/servers/contabo_vps/phpunit.xml'
      - '!whmcs-module/modules/servers/contabo_vps/composer.lock'
      - '!whmcs-module/modules/servers/contabo_vps/.git*'
      - '!whmcs-module/modules/servers/contabo_vps/.claude-flow/**'
      - '!whmcs-module/modules/servers/contabo_vps/graphify-out/**'
      - 'whmcs-module/templates/orderforms/securiace-vps/**'
      - 'scripts/package-whmcs-suite.sh'
      - 'scripts/extract-changelog-section.sh'
      - 'scripts/inspect-github-release.sh'
      - '.github/workflows/release-contabo-vps.yml'
  workflow_dispatch:

concurrency:
  group: release-securiacevps
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package SecuriAce VPS
    if: github.ref == 'refs/heads/main'
    runs-on: contabo-ci-release
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      exists: ${{ steps.meta.outputs.exists }}
    env:
      MODULE_DIR: whmcs-module/modules/servers/securiacevps
      SHIM_DIR: whmcs-module/modules/servers/contabo_vps
      ADDON_DIR: whmcs-module/modules/addons/contabo_pricing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify host PHP 8.2 and Composer
        run: |
          test "$(/usr/bin/php8.2 -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "8.2"
          /usr/bin/php8.2 /usr/local/bin/composer --version

      - name: Resolve version and release state
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_NEW_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*SECURIACE_VPS_VERSION', '\\([^']*\\)'.*/\\1/p" "$MODULE_DIR/securiacevps.php" | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::invalid SECURIACE_VPS_VERSION: $VERSION"
            exit 1
          fi
          TAG="securiacevps-v${VERSION}"
          STATE="$(
            scripts/inspect-github-release.sh \
              "$TAG" \
              "securiacevps-v${VERSION}.zip" \
              "securiacevps-v${VERSION}.zip.sha256" \
              "securiacevps-v${VERSION}.zip.manifest"
          )"
          if [ "$STATE" = "complete" ]; then
            EXISTS=true
          else
            EXISTS=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "SecuriAce VPS $VERSION -> $TAG (already released: $EXISTS)"

      - name: Install test dependencies
        working-directory: ${{ env.ADDON_DIR }}
        run: /usr/bin/php8.2 /usr/local/bin/composer install --no-interaction --no-progress

      - name: Lint canonical module, shim, and templates
        run: |
          set -euo pipefail
          find "$MODULE_DIR" "$SHIM_DIR" -type f \( -name '*.php' -o -name '*.tpl' \) \
            -not -path '*/tests/*' \
            -print0 |
            xargs -0 -n1 /usr/bin/php8.2 -l >/dev/null

      - name: Unit and contract tests
        working-directory: ${{ env.MODULE_DIR }}
        run: /usr/bin/php8.2 ../../addons/contabo_pricing/vendor/bin/phpunit -c phpunit.xml

      - name: Build and inspect installable package
        if: steps.meta.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/package-whmcs-suite.sh --suite
          ZIP="dist/securiacevps-v${VERSION}.zip"
          test -s "$ZIP"
          test -s "$ZIP.sha256"
          test -s "$ZIP.manifest"
          unzip -t "$ZIP"

      - name: Build exact release notes
        if: steps.meta.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="dist/securiacevps-notes.md"
          scripts/extract-changelog-section.sh \
            "$ADDON_DIR/CHANGELOG.md" "securiacevps " "$VERSION" > "$NOTES"
          cat >> "$NOTES" <<'EOF'

          ### Contents
          - `modules/servers/securiacevps/` canonical module
          - `modules/servers/contabo_vps/` staged migration shim
          - `templates/orderforms/securiace-vps/` Standard Cart child

          Install or upgrade `contabo_pricing` first because it owns the shared schema. Follow the operator-controlled migration runbook; this release performs no deployment.

          Verify the ZIP against `.sha256` and inspect `.manifest` before installation.
          EOF

      - name: Stage verified release payload
        if: steps.meta.outputs.exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: securiacevps-release
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/securiacevps-v${{ steps.meta.outputs.version }}.zip
            dist/securiacevps-v${{ steps.meta.outputs.version }}.zip.sha256
            dist/securiacevps-v${{ steps.meta.outputs.version }}.zip.manifest
            dist/securiacevps-notes.md

      - name: Existing release notice
        if: steps.meta.outputs.exists == 'true'
        run: echo "::notice::${{ steps.meta.outputs.tag }} already exists. Bump SECURIACE_VPS_VERSION for a new release."

  publish:
    name: Publish SecuriAce VPS
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: contabo-ci-release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: securiacevps-release
          path: release

      - name: Publish immutable version payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -s "release/securiacevps-v${VERSION}.zip"
          test -s "release/securiacevps-v${VERSION}.zip.sha256"
          test -s "release/securiacevps-v${VERSION}.zip.manifest"
          test -s "release/securiacevps-notes.md"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "SecuriAce VPS ${VERSION}" \
            --notes-file "release/securiacevps-notes.md" \
            "release/securiacevps-v${VERSION}.zip" \
            "release/securiacevps-v${VERSION}.zip.sha256" \
            "release/securiacevps-v${VERSION}.zip.manifest"
