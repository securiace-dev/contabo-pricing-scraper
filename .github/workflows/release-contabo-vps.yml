name: Release contabo_vps module

# Cuts a versioned GitHub Release + installable ZIP of the WHMCS server /
# provisioning module (modules/servers/contabo_vps) when a change to its SHIPPED
# files lands on main and its version (CONTABO_VPS_VERSION in contabo_vps.php)
# has been bumped.
#
# Trigger scope = exactly the files that go into the release ZIP (mirrors the
# package's exclude list via `!` negations): tests/ and dev config are NOT
# shipped, so editing them never triggers a run — the two module workflows stay
# independent. The version constant lives in a shipped file (contabo_vps.php),
# so bumping it triggers a real release; a shipped-code change WITHOUT a version
# bump runs but skips publishing (already released — idempotent).
#
# The package/checksum/changelog/publish logic is shared with the sibling
# workflow via .github/actions/publish-whmcs-module (single source of truth).
#
# Tag scheme: contabo_vps-v<version> (never matches the Rust scraper's `v*`
# tags, so release.yml is not triggered).

on:
  push:
    branches: [main]
    paths:
      - 'whmcs-module/modules/servers/contabo_vps/**'
      - '!whmcs-module/modules/servers/contabo_vps/tests/**'
      - '!whmcs-module/modules/servers/contabo_vps/phpunit.xml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/actions/publish-whmcs-module/action.yml'
  workflow_dispatch:

concurrency:
  group: release-contabo-vps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package & release contabo_vps
    runs-on: ubuntu-latest
    env:
      MODULE_DIR: whmcs-module/modules/servers/contabo_vps
      ADDON_DIR: whmcs-module/modules/addons/contabo_pricing
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, curl, mbstring
          tools: composer

      # The server-module suite runs on the addon's PHPUnit + FakeCapsule (both
      # modules ship together), so install the addon's dev deps first.
      - name: Install PHPUnit (via addon dev deps)
        working-directory: ${{ env.ADDON_DIR }}
        run: composer install --no-interaction --no-progress

      - name: Lint (php -l)
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          set -e
          find lib -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l contabo_vps.php >/dev/null
          php -l hooks.php >/dev/null

      - name: Unit tests
        working-directory: ${{ env.MODULE_DIR }}
        run: ../../addons/contabo_pricing/vendor/bin/phpunit -c phpunit.xml

      - name: Package & publish (idempotent on version)
        uses: ./.github/actions/publish-whmcs-module
        with:
          module_name: contabo_vps
          module_path: whmcs-module/modules/servers/contabo_vps
          dest_subdir: modules/servers
          version_file: contabo_vps.php
          version_pattern: "define\\('CONTABO_VPS_VERSION',\\s*'\\K[^']+"
          tag_prefix: contabo_vps-v
          changelog_file: whmcs-module/modules/addons/contabo_pricing/CHANGELOG.md
          changelog_prefix: 'contabo_vps '
          exclude: './tests ./.phpunit.cache ./phpunit.xml'
          install_notes: |
            1. Download and unzip the attached ZIP at your WHMCS root (it lays down `modules/servers/contabo_vps/`).
            2. Add a server under **System Settings → Servers** using the **Contabo VPS** module, then assign it to a product. Run **Test Connection** before ordering.
          github_token: ${{ secrets.GITHUB_TOKEN }}
