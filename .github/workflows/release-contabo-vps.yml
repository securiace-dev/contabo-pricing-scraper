name: Release SecuriAce VPS suite

# Publishes the canonical WHMCS provisioning runtime as one installable archive:
# securiacevps + contabo_vps compatibility shim + VPS Standard Cart child theme.
# This workflow builds release artifacts only. It never deploys WHMCS.

on:
  push:
    branches: [main]
    paths:
      - 'whmcs-module/modules/servers/securiacevps/**'
      - 'whmcs-module/modules/servers/contabo_vps/**'
      - 'whmcs-module/templates/orderforms/securiace-vps/**'
      - 'scripts/package-whmcs-suite.sh'
      - '.github/workflows/release-contabo-vps.yml'
  workflow_dispatch:

concurrency:
  group: release-securiacevps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package and release SecuriAce VPS
    runs-on: ubuntu-latest
    env:
      MODULE_DIR: whmcs-module/modules/servers/securiacevps
      SHIM_DIR: whmcs-module/modules/servers/contabo_vps
      ADDON_DIR: whmcs-module/modules/addons/contabo_pricing
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, curl, mbstring
          tools: composer

      - name: Install test dependencies
        working-directory: ${{ env.ADDON_DIR }}
        run: composer install --no-interaction --no-progress

      - name: Lint canonical module and shim
        run: |
          set -euo pipefail
          find "$MODULE_DIR" "$SHIM_DIR" -type f -name '*.php' \
            -not -path '*/tests/*' -print0 |
            xargs -0 -n1 php -l >/dev/null

      - name: Unit and contract tests
        working-directory: ${{ env.MODULE_DIR }}
        run: ../../addons/contabo_pricing/vendor/bin/phpunit -c phpunit.xml

      - name: Resolve version and release state
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/.*SECURIACE_VPS_VERSION', '\\([^']*\\)'.*/\\1/p" "$MODULE_DIR/securiacevps.php" | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read SECURIACE_VPS_VERSION"
            exit 1
          fi
          TAG="securiacevps-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "exists=$EXISTS"
          } >> "$GITHUB_OUTPUT"
          echo "SecuriAce VPS $VERSION -> $TAG (already released: $EXISTS)"

      - name: Existing release notice
        if: steps.meta.outputs.exists == 'true'
        run: echo "::notice::${{ steps.meta.outputs.tag }} already exists. Bump SECURIACE_VPS_VERSION for a new release."

      - name: Build and inspect installable package
        if: steps.meta.outputs.exists == 'false'
        id: package
        run: |
          set -euo pipefail
          bash scripts/package-whmcs-suite.sh
          ZIP="dist/securiacevps-v${{ steps.meta.outputs.version }}.zip"
          test -s "$ZIP"
          test -s "$ZIP.sha256"
          test -s "$ZIP.manifest"
          unzip -t "$ZIP"
          {
            echo "zip=$ZIP"
            echo "checksum=$ZIP.sha256"
            echo "manifest=$ZIP.manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        if: steps.meta.outputs.exists == 'false'
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BODY="$(awk -v ver="securiacevps ${VERSION}" '
            $0 ~ "^## " && index($0, ver) {flag=1; print; next}
            flag && /^## / {exit}
            flag {print}
          ' "$ADDON_DIR/CHANGELOG.md")"
          {
            echo "body<<EOF"
            if [ -n "$BODY" ]; then
              echo "$BODY"
            else
              echo "See the addon CHANGELOG for details."
            fi
            echo ""
            echo "### Contents"
            echo "- \`modules/servers/securiacevps/\` canonical module"
            echo "- \`modules/servers/contabo_vps/\` staged migration shim"
            echo "- \`templates/orderforms/securiace-vps/\` Standard Cart child"
            echo ""
            echo "Install or upgrade \`contabo_pricing\` first because it owns the shared schema. Follow the operator-controlled migration runbook; this release performs no deployment."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SecuriAce VPS ${{ steps.meta.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.manifest }}
          draft: false
          prerelease: false
