name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux static binaries via zigbuild (zig ships musl headers for all arches)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: contabo-scraper-linux-x86_64
            use_zigbuild: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: contabo-scraper-linux-arm64
            use_zigbuild: true

          # macOS — Intel + Apple Silicon
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: contabo-scraper-macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: contabo-scraper-macos-arm64

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: contabo-scraper-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      # Fail immediately if the pushed tag doesn't match Cargo.toml version.
      # Prevents releasing a binary that reports a stale version string.
      - name: Verify tag matches Cargo.toml version
        if: runner.os != 'Windows'
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          TAG_VER="${{ github.ref_name }}"
          TAG_VER="${TAG_VER#v}"   # strip leading 'v'
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VER) != tag ($TAG_VER)"
            echo "Run: scripts/bump-version.sh <new-version>"
            exit 1
          fi
          echo "Version check passed: $CARGO_VER"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zigbuild for Linux musl targets — zig ships built-in musl libc headers for
      # all arches, avoiding the glibc/musl ABI mismatch that breaks standard
      # cross-linkers (aarch64-linux-gnu-gcc references __vsnprintf_chk etc.).
      - name: Install Zig
        if: matrix.use_zigbuild == true
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild == true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary (zigbuild)
        if: matrix.use_zigbuild == true
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build release binary
        if: matrix.use_zigbuild != true
        run: cargo build --release --target ${{ matrix.target }}

      # Rename and strip (non-Windows)
      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/contabo-scraper ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\contabo-scraper.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## contabo-scraper ${{ github.ref_name }}

            Single-binary release. No runtime dependencies — just download and run.

            ### Install

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/contabo-scraper-macos-arm64 -o contabo-scraper
            chmod +x contabo-scraper
            ./contabo-scraper --help
            ```

            **macOS (Intel)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/contabo-scraper-macos-x86_64 -o contabo-scraper
            chmod +x contabo-scraper && ./contabo-scraper --help
            ```

            **Linux (x86_64)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/contabo-scraper-linux-x86_64 -o contabo-scraper
            chmod +x contabo-scraper && ./contabo-scraper --help
            ```

            **Windows**
            Download `contabo-scraper-windows-x86_64.exe`, rename to `contabo-scraper.exe`, run from terminal.

            ### Usage
            ```bash
            ./contabo-scraper                           # scrape all 16 plans
            ./contabo-scraper --concurrency 8           # faster
            ./contabo-scraper --plans cloud-vps-10,vds-s
            ./contabo-scraper --json --quiet            # AI agent / pipeline mode
            ```

            ### New in 2.3+

            - **`serve` subcommand** — long-running HTTP API server. See [README](https://github.com/${{ github.repository }}#api-quick-start).
            - **Docker image**: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}` (multi-arch: linux/amd64, linux/arm64). Compose recipes under `deploy/`.
            - **WHMCS addon** — sync Contabo pricing into WHMCS products via versioned profiles. Source under `whmcs-module/`.

            Verify with `SHA256SUMS.txt`.
          files: |
            artifacts/*
          draft: false
          prerelease: false

  docker:
    name: Publish Docker image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          VER="${{ github.ref_name }}"
          VER="${VER#v}"   # strip leading v
          {
            echo "tags=${IMG}:${VER},${IMG}:latest"
            echo "image=${IMG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          docker run --rm "${{ steps.tags.outputs.image }}:latest" --version
          docker run --rm -d --name cv-smoke -p 8080:8080 "${{ steps.tags.outputs.image }}:latest"
          sleep 6
          curl -fsS http://localhost:8080/api/v1/health
          docker rm -f cv-smoke
