name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: contabo-ci-release
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux static binaries via zigbuild (zig ships musl headers for all arches)
          - target: x86_64-unknown-linux-musl
            artifact: contabo-scraper-linux-x86_64

          - target: aarch64-unknown-linux-musl
            artifact: contabo-scraper-linux-arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Fail immediately if the pushed tag doesn't match Cargo.toml version.
      # Prevents releasing a binary that reports a stale version string.
      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          TAG_VER="${{ github.ref_name }}"
          TAG_VER="${TAG_VER#v}"   # strip leading 'v'
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VER) != tag ($TAG_VER)"
            echo "Run: scripts/bump-version.sh <new-version>"
            exit 1
          fi
          echo "Version check passed: $CARGO_VER"

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          targets: ${{ matrix.target }}

      # zigbuild for Linux musl targets — zig ships built-in musl libc headers for
      # all arches, avoiding the glibc/musl ABI mismatch that breaks standard
      # cross-linkers (aarch64-linux-gnu-gcc references __vsnprintf_chk etc.).
      - name: Install Zig 0.15.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild 0.23.0
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build release binary (zigbuild)
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Stage Linux artifact
        run: |
          cp target/${{ matrix.target }}/release/contabo-scraper ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: contabo-ci-release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum -- ./* | sed 's#  \./#  #' > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## contabo-scraper ${{ github.ref_name }}

            Static Linux binaries. No runtime dependencies — just download and run.

            ### Install

            **Linux (x86_64)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/contabo-scraper-linux-x86_64 -o contabo-scraper
            chmod +x contabo-scraper && ./contabo-scraper --help
            ```

            **Linux (ARM64)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/contabo-scraper-linux-arm64 -o contabo-scraper
            chmod +x contabo-scraper && ./contabo-scraper --help
            ```

            ### Usage
            ```bash
            ./contabo-scraper                           # scrape all 16 plans
            ./contabo-scraper --concurrency 8           # faster
            ./contabo-scraper --plans cloud-vps-10,vds-s
            ./contabo-scraper --json --quiet            # AI agent / pipeline mode
            ```

            ### New in 2.3+

            - **`serve` subcommand** — long-running HTTP API server. See [README](https://github.com/${{ github.repository }}#api-quick-start).
            - **Docker image**: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}` (multi-arch: linux/amd64, linux/arm64). Compose recipes under `deploy/`.
            - **WHMCS addon** — sync Contabo pricing into WHMCS products via versioned profiles. Source under `whmcs-module/`.

            Verify with `SHA256SUMS.txt`.
          files: |
            artifacts/*
          draft: false
          prerelease: false

  docker:
    name: Publish Docker image to GHCR
    needs: build
    runs-on: contabo-ci-release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          VER="${{ github.ref_name }}"
          VER="${VER#v}"   # strip leading v
          {
            echo "tags=${IMG}:${VER},${IMG}:latest"
            echo "image=${IMG}"
            echo "version=${VER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}"
          NAME="cv-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT

          docker pull "$IMAGE"
          DIGEST="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$DIGEST"
          docker run --rm "$DIGEST" --version
          docker run --rm -d --name "$NAME" -p 127.0.0.1::8080 "$DIGEST"
          PORT="$(docker port "$NAME" 8080/tcp | sed -n 's/.*://p' | head -n 1)"
          test -n "$PORT"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health"; then
              exit 0
            fi
            sleep 2
          done
          echo "Container health endpoint did not become ready" >&2
          exit 1
