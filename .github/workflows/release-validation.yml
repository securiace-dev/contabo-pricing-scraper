name: Linux Release Validation

on:
  pull_request:
    paths:
      - 'scripts/package-whmcs-suite.sh'
      - 'whmcs-module/**'
      - '.github/workflows/release-contabo-pricing.yml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/workflows/release-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/package-whmcs-suite.sh'
      - 'whmcs-module/**'
      - '.github/workflows/release-contabo-pricing.yml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/workflows/release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whmcs-release:
    name: WHMCS packages without publication
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # contabo-ci-pr has no Docker. Patched php:8.2.35-cli and php:8.3.36-cli
    # run on contabo-ci-release. This job does not publish.
    runs-on: contabo-ci-release
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run addon and provisioning suites on patched PHP
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is required to run php:8.2.35-cli and php:8.3.36-cli. This job is red because the runner has no usable Docker. Host /usr/bin/php8.2 is not a patched runtime."
            exit 1
          fi
          addon=whmcs-module/modules/addons/contabo_pricing
          server=whmcs-module/modules/servers/securiacevps
          if [ ! -x "${addon}/vendor/bin/phpunit" ]; then
            echo "vendor/bin/phpunit missing; composer install inside php:8.2.35-cli"
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/work" \
              -w /work \
              -e COMPOSER_ALLOW_SUPERUSER=1 \
              -e HOST_UID="$(id -u)" \
              -e HOST_GID="$(id -g)" \
              -e ADDON="$addon" \
              php:8.2.35-cli \
              bash -c '
                set -euo pipefail
                actual="$(php -r "echo PHP_VERSION;")"
                if [ "$actual" != "8.2.35" ]; then
                  echo "expected PHP 8.2.35, image reports ${actual}" >&2
                  exit 1
                fi
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends unzip
                curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
                php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
                rm -f /tmp/composer-setup.php
                composer install --no-interaction --prefer-dist --no-progress --working-dir="$ADDON"
                chown -R "${HOST_UID}:${HOST_GID}" "${ADDON}/vendor"
              '
          fi
          for image in php:8.2.35-cli php:8.3.36-cli; do
            case "$image" in
              php:8.2.35-cli) expected=8.2.35 ;;
              php:8.3.36-cli) expected=8.3.36 ;;
              *) echo "::error::unexpected image ${image}"; exit 1 ;;
            esac
            echo "=== ${image} ==="
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e EXPECTED_PHP="$expected" \
              -e ADDON="$addon" \
              -e SERVER="$server" \
              -v "${GITHUB_WORKSPACE}:/work" \
              -w /work \
              "$image" \
              bash -c '
                set -euo pipefail
                actual="$(php -r "echo PHP_VERSION;")"
                if [ "$actual" != "$EXPECTED_PHP" ]; then
                  echo "expected PHP ${EXPECTED_PHP}, image reports ${actual}" >&2
                  exit 1
                fi
                php "${ADDON}/vendor/bin/phpunit" --do-not-cache-result -c "${ADDON}/phpunit.xml"
                php "${ADDON}/vendor/bin/phpunit" --do-not-cache-result -c "${SERVER}/phpunit.xml"
              '
          done

      - name: Build and verify installable archives
        run: |
          set -euo pipefail
          bash scripts/package-whmcs-suite.sh --all
          shopt -s nullglob
          ARCHIVES=(
            dist/contabo_pricing-v*.zip
            dist/securiacevps-v*.zip
          )
          test "${#ARCHIVES[@]}" -eq 2
          for archive in "${ARCHIVES[@]}"; do
            test -s "$archive"
            test -s "$archive.sha256"
            test -s "$archive.manifest"
            unzip -t "$archive"
            (
              cd dist
              sha256sum -c "$(basename "$archive").sha256"
            )
          done
