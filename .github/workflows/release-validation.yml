name: Linux Release Validation

on:
  pull_request:
    paths:
      - 'scripts/package-whmcs-suite.sh'
      - 'whmcs-module/**'
      - '.github/workflows/release-contabo-pricing.yml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/workflows/release-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/package-whmcs-suite.sh'
      - 'whmcs-module/**'
      - '.github/workflows/release-contabo-pricing.yml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/workflows/release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whmcs-release:
    name: WHMCS packages without publication
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: contabo-ci-pr
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify host PHP 8.2 and Composer
        run: |
          test "$(/usr/bin/php8.2 -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "8.2"
          /usr/bin/php8.2 /usr/local/bin/composer --version

      - name: Install test dependencies
        working-directory: whmcs-module/modules/addons/contabo_pricing
        run: /usr/bin/php8.2 /usr/local/bin/composer install --no-interaction --prefer-dist --no-progress

      - name: Run addon and provisioning suites
        run: |
          /usr/bin/php8.2 \
            whmcs-module/modules/addons/contabo_pricing/vendor/bin/phpunit \
            -c whmcs-module/modules/addons/contabo_pricing/phpunit.xml \
            --do-not-cache-result
          /usr/bin/php8.2 \
            whmcs-module/modules/addons/contabo_pricing/vendor/bin/phpunit \
            -c whmcs-module/modules/servers/securiacevps/phpunit.xml \
            --do-not-cache-result

      - name: Build and verify installable archives
        run: |
          set -euo pipefail
          bash scripts/package-whmcs-suite.sh --all
          shopt -s nullglob
          ARCHIVES=(
            dist/contabo_pricing-v*.zip
            dist/securiacevps-v*.zip
          )
          test "${#ARCHIVES[@]}" -eq 2
          for archive in "${ARCHIVES[@]}"; do
            test -s "$archive"
            test -s "$archive.sha256"
            test -s "$archive.manifest"
            unzip -t "$archive"
            (
              cd dist
              sha256sum -c "$(basename "$archive").sha256"
            )
          done
