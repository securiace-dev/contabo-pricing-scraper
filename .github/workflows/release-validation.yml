name: Linux Release Dry Run

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-whmcs-suite.sh'
      - 'scripts/resolve-scraper-release.sh'
      - 'scripts/test-resolve-scraper-release.sh'
      - 'whmcs-module/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-contabo-pricing.yml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/workflows/release-validation.yml'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release:
    name: Linux binaries, image, and scraper assets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: contabo-ci-release
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize job-local build paths
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/release-target" >> "$GITHUB_ENV"

      - name: Verify release runner capabilities
        run: |
          set -euo pipefail
          for command in docker file gh readelf sha256sum; do
            command -v "$command"
          done

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Set up Zig 0.15.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.1

      - name: Set up cargo-zigbuild 0.23.0
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build Linux x86_64 and ARM64 binaries
        run: |
          cargo zigbuild --locked --release --target x86_64-unknown-linux-musl
          cargo zigbuild --locked --release --target aarch64-unknown-linux-musl

      - name: Verify binary architecture and execution
        run: |
          set -euo pipefail
          X86="$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/contabo-scraper"
          ARM="$CARGO_TARGET_DIR/aarch64-unknown-linux-musl/release/contabo-scraper"
          file "$X86" | grep -F 'x86-64'
          file "$ARM" | grep -F 'ARM aarch64'
          readelf -h "$X86" | grep -E 'Machine:.*X86-64'
          readelf -h "$ARM" | grep -E 'Machine:.*AArch64'
          "$X86" --version
          "$ARM" --version

      - name: Validate scraper release resolver
        run: bash scripts/test-resolve-scraper-release.sh

      - name: Verify current immutable scraper release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/current-scraper-release"
          mkdir -p "$RELEASE_DIR"
          TAG="$(scripts/resolve-scraper-release.sh latest)"
          gh release download "$TAG" \
            --pattern contabo-scraper-linux-x86_64 \
            --pattern SHA256SUMS.txt \
            --dir "$RELEASE_DIR"
          EXPECTED="$(
            awk '$2 == "contabo-scraper-linux-x86_64" { print $1 }' \
              "$RELEASE_DIR/SHA256SUMS.txt"
          )"
          ACTUAL="$(sha256sum "$RELEASE_DIR/contabo-scraper-linux-x86_64" | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          chmod 0700 "$RELEASE_DIR/contabo-scraper-linux-x86_64"
          "$RELEASE_DIR/contabo-scraper-linux-x86_64" --version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build multi-architecture OCI image without publishing
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output "type=oci,dest=${RUNNER_TEMP}/contabo-multiarch.tar" \
            .
          test -s "${RUNNER_TEMP}/contabo-multiarch.tar"

      - name: Build and smoke native image without publishing
        run: |
          set -euo pipefail
          IMAGE="contabo-release-validation:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NAME="contabo-release-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BROWSER_VOLUME="contabo-release-validation-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true; docker volume rm -f "$BROWSER_VOLUME" >/dev/null 2>&1 || true; docker image rm -f "$IMAGE" >/dev/null 2>&1 || true' EXIT

          docker build --tag "$IMAGE" .
          docker run --rm "$IMAGE" --version
          docker volume create "$BROWSER_VOLUME"
          docker run --rm \
            --mount "source=${BROWSER_VOLUME},target=/home/contabo/.cloakbrowser" \
            --entrypoint /usr/local/bin/node \
            "$IMAGE" \
            --input-type=module \
            --eval "const { launch } = await import('/app/node_modules/cloakbrowser/dist/index.js'); const browser = await launch({ headless: true }); await browser.close()"
          docker run --rm -d --name "$NAME" -p 127.0.0.1::8080 "$IMAGE"
          PORT="$(docker port "$NAME" 8080/tcp | sed -n 's/.*://p' | head -n 1)"
          test -n "$PORT"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health"; then
              exit 0
            fi
            sleep 2
          done
          echo "Dry-run image health endpoint did not become ready" >&2
          exit 1

  whmcs-release:
    name: WHMCS packages without publication
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: contabo-ci-release
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify host PHP 8.2 and Composer
        run: |
          test "$(/usr/bin/php8.2 -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "8.2"
          /usr/bin/php8.2 /usr/local/bin/composer --version

      - name: Install test dependencies
        working-directory: whmcs-module/modules/addons/contabo_pricing
        run: /usr/bin/php8.2 /usr/local/bin/composer install --no-interaction --prefer-dist --no-progress

      - name: Run addon and provisioning suites
        run: |
          /usr/bin/php8.2 \
            whmcs-module/modules/addons/contabo_pricing/vendor/bin/phpunit \
            -c whmcs-module/modules/addons/contabo_pricing/phpunit.xml \
            --do-not-cache-result
          /usr/bin/php8.2 \
            whmcs-module/modules/addons/contabo_pricing/vendor/bin/phpunit \
            -c whmcs-module/modules/servers/securiacevps/phpunit.xml \
            --do-not-cache-result

      - name: Build and verify installable archives
        run: |
          set -euo pipefail
          bash scripts/package-whmcs-suite.sh --all
          shopt -s nullglob
          ARCHIVES=(
            dist/contabo_pricing-v*.zip
            dist/securiacevps-v*.zip
          )
          test "${#ARCHIVES[@]}" -eq 2
          for archive in "${ARCHIVES[@]}"; do
            test -s "$archive"
            test -s "$archive.sha256"
            test -s "$archive.manifest"
            unzip -t "$archive"
            (
              cd dist
              sha256sum -c "$(basename "$archive").sha256"
            )
          done
