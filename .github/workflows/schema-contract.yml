name: Producer Consumer Schema Contract

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SCHEMA_VERSION.md'
      - 'whmcs-module/modules/addons/contabo_pricing/**/*.php'
      - 'whmcs-module/modules/servers/**/*.php'
      - 'whmcs-module/**/*.tpl'
      - 'scripts/**/*.php'
      - 'scripts/predeploy-check.sh'
      - '.github/workflows/schema-contract.yml'
  workflow_dispatch:

concurrency:
  group: schema-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php74-runtime-lint:
    name: PHP 7.4 runtime syntax
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: contabo-ci-pr
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify host PHP 7.4 runtime
        run: |
          test "$(/usr/bin/php7.4 -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "7.4"
          /usr/bin/php7.4 --version

      - name: Lint WHMCS runtime sources
        run: |
          find \
            whmcs-module/modules/addons/contabo_pricing \
            whmcs-module/modules/servers/securiacevps \
            whmcs-module/modules/servers/contabo_vps \
            scripts \
            -type f \( -name '*.php' -o -name '*.tpl' \) \
            -not -path '*/vendor/*' \
            -not -path '*/tests/*' \
            -print0 \
            | sort -z \
            | xargs -0 -n1 /usr/bin/php7.4 -l

  contract:
    name: Rust producer ↔ WHMCS consumer
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: contabo-ci-pr
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require deliberate schema documentation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          fixture_changed=0
          constant_changed=0
          if grep -q '^tests/fixtures/api/' <<<"$changed"; then
            fixture_changed=1
          fi
          if git diff -U0 "$BASE_SHA"...HEAD -- \
            src/main.rs \
            src/api/catalog.rs \
            whmcs-module/modules/addons/contabo_pricing/lib/Installer.php \
            | grep -Eq '^[+-][^+-].*(SCHEMA_VERSION|CATALOG_SCHEMA_VERSION)'; then
            constant_changed=1
          fi
          if [ "$fixture_changed" -eq 1 ] || [ "$constant_changed" -eq 1 ]; then
            if ! grep -qx 'SCHEMA_VERSION.md' <<<"$changed"; then
              echo "Schema constants or golden fixtures changed without SCHEMA_VERSION.md." >&2
              exit 1
            fi
          fi

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: contabo-ci-pr-${{ runner.arch }}-rust-1.96.0

      - name: Verify Rust producer contract
        run: cargo test --test schema_contract

      - name: Verify host PHP 8.2 and Composer
        run: |
          test "$(/usr/bin/php8.2 -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "8.2"
          /usr/bin/php8.2 /usr/local/bin/composer --version

      - name: Install WHMCS addon test dependencies
        working-directory: whmcs-module/modules/addons/contabo_pricing
        run: /usr/bin/php8.2 /usr/local/bin/composer install --no-interaction --prefer-dist --no-progress

      - name: Verify WHMCS consumer contract
        working-directory: whmcs-module/modules/addons/contabo_pricing
        run: /usr/bin/php8.2 vendor/bin/phpunit tests/GoldenApiContractTest.php
