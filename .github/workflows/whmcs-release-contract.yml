name: WHMCS Release Contract

on:
  pull_request:
    paths:
      - 'whmcs-module/**'
      - 'scripts/package-whmcs-suite.sh'
      - 'scripts/extract-changelog-section.sh'
      - 'scripts/inspect-github-release.sh'
      - 'scripts/test-whmcs-release-contract.sh'
      - '.github/workflows/release-contabo-pricing.yml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/workflows/whmcs-release-contract.yml'
  push:
    branches: [main]
    paths:
      - 'whmcs-module/**'
      - 'scripts/package-whmcs-suite.sh'
      - 'scripts/extract-changelog-section.sh'
      - 'scripts/inspect-github-release.sh'
      - 'scripts/test-whmcs-release-contract.sh'
      - '.github/workflows/release-contabo-pricing.yml'
      - '.github/workflows/release-contabo-vps.yml'
      - '.github/workflows/whmcs-release-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Workflows and installable artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned actionlint
        env:
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}"

      - name: Validate workflow syntax and expressions
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/release-contabo-pricing.yml \
            .github/workflows/release-contabo-vps.yml \
            .github/workflows/whmcs-release-contract.yml

      - name: Validate release shell
        run: |
          set -euo pipefail
          bash -n \
            scripts/package-whmcs-suite.sh \
            scripts/extract-changelog-section.sh \
            scripts/inspect-github-release.sh \
            scripts/test-whmcs-release-contract.sh
          shellcheck \
            scripts/package-whmcs-suite.sh \
            scripts/extract-changelog-section.sh \
            scripts/inspect-github-release.sh \
            scripts/test-whmcs-release-contract.sh

      - name: Validate changelog and package contracts
        run: bash scripts/test-whmcs-release-contract.sh
