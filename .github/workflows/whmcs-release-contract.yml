name: WHMCS Release Contract

on:
  pull_request:
    paths:
      - 'whmcs-module/**'
      - 'scripts/package-whmcs-suite.sh'
      - 'scripts/extract-changelog-section.sh'
      - 'scripts/inspect-github-release.sh'
      - 'scripts/test-whmcs-release-contract.sh'
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'whmcs-module/**'
      - 'scripts/package-whmcs-suite.sh'
      - 'scripts/extract-changelog-section.sh'
      - 'scripts/inspect-github-release.sh'
      - 'scripts/test-whmcs-release-contract.sh'
      - '.github/actionlint.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    name: Workflows and installable artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: contabo-ci-pr
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner capabilities
        run: |
          set -euo pipefail
          for command in go shellcheck sha256sum unzip zip; do
            command -v "$command"
          done

      - name: Install pinned actionlint
        env:
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
          GOBIN: ${{ runner.temp }}/actionlint-bin
          GOCACHE: ${{ runner.temp }}/go-build
          GOMODCACHE: ${{ runner.temp }}/go-mod
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}"

      - name: Validate workflow syntax and expressions
        run: |
          "${RUNNER_TEMP}/actionlint-bin/actionlint" .github/workflows/*.yml

      - name: Validate release shell
        run: |
          set -euo pipefail
          bash -n \
            scripts/package-whmcs-suite.sh \
            scripts/extract-changelog-section.sh \
            scripts/inspect-github-release.sh \
            scripts/test-whmcs-release-contract.sh
          shellcheck --severity=style \
            scripts/package-whmcs-suite.sh \
            scripts/extract-changelog-section.sh \
            scripts/inspect-github-release.sh \
            scripts/test-whmcs-release-contract.sh

      - name: Validate changelog and package contracts
        run: bash scripts/test-whmcs-release-contract.sh
