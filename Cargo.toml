[package]
name = "contabo-scraper"
version = "2.3.1"
edition = "2021"
description = "Scrapes Contabo Cloud VPS, Storage VPS, and Cloud VDS pricing from embedded __SAPPER__ payloads"
license = "MIT"

[[bin]]
name = "contabo-scraper"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["rt-multi-thread", "macros", "time", "fs", "signal", "process", "sync"] }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = { version = "1", features = ["preserve_order"] }
rquickjs    = { version = "0.8",  default-features = false, features = ["array-buffer"] }
once_cell   = "1"
regex       = "1"
chrono      = { version = "0.4",  default-features = false, features = ["clock", "std", "serde"] }
futures     = { version = "0.3",  default-features = false, features = ["executor"] }

# CLI
clap            = { version = "4", features = ["derive", "env"] }

# Web server (used in `serve` subcommand)
axum            = { version = "0.7", features = ["ws", "macros"] }
tower           = "0.5"
tower-http      = { version = "0.6", features = ["cors", "compression-br", "trace", "fs"] }

# Observability
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Misc API support
anyhow          = "1"
thiserror       = "2"
rust-embed      = { version = "8", features = ["compression", "include-exclude"] }
notify          = "7"
uuid            = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
strip          = true
panic          = "abort"
